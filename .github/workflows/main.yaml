name: App CI/CD pipeline
env:
  PYTHON_VERSION: 3.12.5

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # --------------------------------------------------------------------------------
  qa-check:
    name: QA checks 🕵️
    runs-on: ubuntu-latest
    strategy:
      # GitHub won't cancel other jobs in the matrix if any job in the matrix fails
      fail-fast: false
      matrix:
        check: [test, lint, style, type, migrations-check]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run poe ${{ matrix.check }}
  prettier-check:
    name: Prettier check 🕵️
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - run: npm install
      - run: npx prettier --check .
  dependency-audit:
    name: Dependency audit 🔒
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run poe audit
  # --------------------------------------------------------------------------------
  build-and-release:
    name: Build and release 🏗️
    if: github.ref == 'refs/heads/main'
    needs: [qa-check, prettier-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Login to docker hub
        id: docker-hub
        env:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: docker login -u $username -p $password
      - name: Build the docker image
        id: build-docker-image
        run: docker build -f docker/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/ultihub:latest .
      - name: Push the docker image
        id: push-docker-image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/ultihub:latest
  # --------------------------------------------------------------------------------
  deployment:
    name: Deployment 🚀
    if: github.ref == 'refs/heads/main'
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Move the deployment files to the repository root
        run: |
          mv docker/compose.prod.yaml docker-compose.yaml
          mv nginx-proxy/redirect.conf redirect.conf
          mv nginx-proxy/vhostd.conf vhostd.conf
      - name: Copy the deployment files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          source: docker-compose.yaml,redirect.conf,vhostd.conf
          target: /home/mara/ultihub
      - name: Replace secrets
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            sed -i \
              -e 's|__LETSENCRYPT_EMAIL__|${{ secrets.LETSENCRYPT_EMAIL }}|g' \
              -e 's|__DATADOG_API_KEY__|${{ secrets.DATADOG_API_KEY }}|g' \
              -e 's|__DATABASE_PASSWORD__|${{ secrets.DATABASE_PASSWORD }}|g' \
              /home/mara/ultihub/docker-compose.yaml
      - name: Pull, release and restart the docker-compose
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            cd ultihub
            docker system df
            docker tag ${{ secrets.DOCKERHUB_USERNAME }}/ultihub:latest ${{ secrets.DOCKERHUB_USERNAME }}/ultihub:previous || true
            docker compose pull
            docker compose run --rm release
            docker compose up -d --remove-orphans --wait --wait-timeout 180
            # docker-gen reloads nginx only when its own generated config changes,
            # so a changed vhost.d snippet needs an explicit reload.
            docker compose exec -T nginx-proxy nginx -s reload || true
            docker image prune -f || true
            docker system df
  # --------------------------------------------------------------------------------
  healthcheck:
    name: Healthcheck ✅
    if: github.ref == 'refs/heads/main' && always()
    needs: deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed service URL
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://evidence.frisbee.cz
          max-attempts: 10
          retry-delay: 4s
          retry-all: true
