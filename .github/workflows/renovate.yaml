name: Renovate

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-image: renovate/renovate@sha256:4a93eba384999995555d48ff194d5013230fe44142260292cdaf9e7bd45ed949
          renovate-version: 44.149.2
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_GIT_AUTHOR: Renovate Bot <29139614+renovate[bot]@users.noreply.github.com>
          RENOVATE_DOCKER_MAX_PAGES: "10"
