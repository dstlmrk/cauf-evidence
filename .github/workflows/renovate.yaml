name: Renovate

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-image: renovate/renovate@sha256:e9279a5df7697622f880306c84460be14a0492d5dcf5b20cdae1995c836cc4d7
          renovate-version: 44.175.0
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_GIT_AUTHOR: Renovate Bot <29139614+renovate[bot]@users.noreply.github.com>
          RENOVATE_DOCKER_MAX_PAGES: "10"
