services:
  app:
    container_name: app
    image: ultihub
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    restart: always
    entrypoint: ["/app/ultihub/manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - ../ultihub/:/app/ultihub
      - ../static/:/app/static
    environment:
      PYTHONUNBUFFERED: true
    env_file:
      - ../secrets/.env.dev

  worker:
    image: ultihub
    restart: always
    entrypoint: ["/app/ultihub/manage.py", "run_huey", "-q"]
    volumes:
      - ../ultihub/:/app/ultihub
    depends_on:
      - redis
    env_file:
      - ../secrets/.env.dev
    environment:
      PYTHONUNBUFFERED: true

  redis:
    image: redis:8.10-alpine
    restart: always
    expose:
      - 6379

  db:
    image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ultihub
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ultihub

  webpack:
    image: node:26-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
    working_dir: /app
    volumes:
      - ../assets/:/app/assets/
      - ../static/:/app/static/
      - ../package.json:/app/package.json
      - ../package-lock.json:/app/package-lock.json
      - ../webpack.config.js:/app/webpack.config.js
    command: ["sh", "-c", "npm ci && npm run watch"]

volumes:
  postgres_data:
